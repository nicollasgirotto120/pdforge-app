<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">PDForge — NG Labs product showcase</title>
<desc id="desc">Animated product banner for PDForge, a local Android toolkit for PDF operations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190d0b"/><stop offset="1" stop-color="#54251b"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5dc"/><stop offset="1" stop-color="#f39c7e"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <style>.pulse{animation:pulse 3.2s ease-in-out infinite}.dash{stroke-dasharray:8 12;animation:dash 18s linear infinite}.page2{animation:page2 3.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.38}}@keyframes dash{to{stroke-dashoffset:-200}}@keyframes page2{50%{opacity:.42}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}text{font-family:Arial,Helvetica,sans-serif}</style>
</defs>
<rect width="1200" height="420" rx="34" fill="url(#bg)"/>
<circle class="pulse" cx="982" cy="206" r="190" fill="#ff7e54" opacity=".15" filter="url(#blur)"/>
<path class="dash" d="M744 62C952-12 1155 106 1124 327" fill="none" stroke="#ffb59c" stroke-opacity=".34" stroke-width="2"/>
<text x="72" y="74" fill="#ffb59c" font-size="14" font-weight="700" letter-spacing="5">NG LABS  /  PRODUCT 03</text>
<text x="72" y="188" fill="#fff" font-size="72" font-weight="800" letter-spacing="-3">PDFORGE</text>
<text x="76" y="232" fill="#d6bbb2" font-size="22">Split, merge, compress and convert PDFs — locally.</text>
<g transform="translate(76 300)">
  <rect width="118" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15"/><text x="59" y="27" text-anchor="middle" fill="#f6ddd5" font-size="13" font-weight="700">MERGE</text>
  <rect x="131" width="112" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15"/><text x="187" y="27" text-anchor="middle" fill="#f6ddd5" font-size="13" font-weight="700">SPLIT</text>
  <rect x="256" width="170" height="42" rx="21" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15"/><text x="341" y="27" text-anchor="middle" fill="#f6ddd5" font-size="13" font-weight="700">OFFLINE-FIRST</text>
</g>
<g transform="translate(820 48) rotate(4 135 160)">
  <rect width="270" height="326" rx="38" fill="url(#phone)" stroke="#fff" stroke-opacity=".62"/>
  <rect x="91" y="18" width="88" height="7" rx="4" fill="#3d1a13" opacity=".3"/>
  <rect x="32" y="55" width="66" height="66" rx="19" fill="#1b1110"/><text x="65" y="96" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">PDF</text>
  <text x="32" y="154" fill="#48251c" font-size="12" font-weight="700" letter-spacing="2">SEUS ARQUIVOS</text>
  <g transform="translate(37 181)">
    <rect x="70" y="32" width="118" height="79" rx="10" fill="#fff" fill-opacity=".42" stroke="#6b3021" stroke-opacity=".18"/>
    <rect class="page2" x="36" y="16" width="118" height="79" rx="10" fill="#fff" fill-opacity=".64" stroke="#6b3021" stroke-opacity=".2"/>
    <rect width="118" height="79" rx="10" fill="#fff" fill-opacity=".9" stroke="#6b3021" stroke-opacity=".22"/>
    <rect x="17" y="18" width="52" height="6" rx="3" fill="#d15b3b"/><rect x="17" y="34" width="80" height="5" rx="3" fill="#8a655b" opacity=".45"/><rect x="17" y="48" width="66" height="5" rx="3" fill="#8a655b" opacity=".34"/>
  </g>
</g>
<g transform="translate(742 124) rotate(-7 60 42)"><rect width="144" height="84" rx="19" fill="#fff" fill-opacity=".93"/><circle cx="28" cy="27" r="7" fill="#df6847"/><text x="21" y="59" fill="#5f2b20" font-size="11" font-weight="700">PROCESSADO</text><text x="21" y="74" fill="#806b64" font-size="9">no aparelho</text></g>
</svg>
